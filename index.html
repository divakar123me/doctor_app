<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediBook - Doctor Appointments &amp; Patient CRM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="auth">
  <div class="auth-card">
    <div class="logo">&#10010; MediBook</div>
    <p class="mut">Doctor appointments &amp; patient care, in one place.</p>
    <div class="tabs"><button class="on" data-tab="login">Login</button><button data-tab="register">Register</button></div>
    <form id="loginForm">
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn block">Sign in</button>
    </form>
    <form id="regForm" hidden>
      <label>Full name<input name="name" required></label>
      <label>Email<input name="email" type="email" required></label>
      <label>Phone<input name="phone" required placeholder="+91 98000 00000"></label>
      <label>Password (8+ chars, letters &amp; numbers)<input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
      <button class="btn block">Create patient account</button>
    </form>
    <button class="btn ghost block" id="guestBtn" type="button">&#128197; Book an appointment (no login needed)</button>
  </div>
</section>
<section id="guest" hidden><div class="auth-card" style="max-width:560px"><div class="logo">&#10010; MediBook</div><h3>Book an appointment</h3><div id="guestBox"></div>
  <button class="btn ghost block" id="backLogin" type="button">&#8592; Back to login</button></div></section>
<div id="app" hidden>
  <header class="top"><button id="burger" class="btn ghost" aria-label="Menu">&#9776;</button><b class="logo">&#10010; MediBook</b>
    <div class="row"><button id="bell" class="btn ghost">&#128276;</button><span id="who" class="mut"></span><button id="logout" class="btn ghost">Logout</button></div></header>
  <aside id="side"><nav class="nav" id="nav"></nav></aside>
  <main id="view"></main>
</div>
<div id="loader" hidden><i></i></div><div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
